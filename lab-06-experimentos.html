<script>
/* Lab 06 — Experimentos: outra pegada para a capa e para os Indicadores.
   Cartografia do Fomento · TCC Pedro H. F. Moreira (Design UFMG).

   Seis experimentos sobre os mesmos dados (js/data.js), todos em implementação própria,
   sem código de terceiros. Algoritmos e referências (lista ABNT em rizoma/README-RIZOMA.md, seção 7):

   01 CAMPO DE FLUXO (capa)      — ruído de Perlin (PERLIN, 1985) lido como campo vetorial; cada
                                   projeto solta partículas em número proporcional ao valor, que seguem o
                                   campo e deixam rastro. Técnica difundida por Shiffman (The Nature of Code,
                                   2012/2024) e pelo ensaio "Flow Fields" de Tyler Hobbs (2020).
   02 TIPOGRAFIA VIVA (capa)     — título amostrado em pixels (p5.Graphics + loadPixels) e ocupado por
                                   partículas com comportamento de direção "arrive" (REYNOLDS, 1999);
                                   cada partícula é uma fração do valor de um projeto; o dedo dispersa.
   03 CÉLULAS DE VALOR (indic.)  — diagrama de Voronoi (VORONOI, 1908) e de potência (AURENHAMMER, 1987)
                                   calculado por força bruta numa grade grossa; ajuste iterativo dos pesos
                                   para que a área de cada célula se aproxime do valor do projeto, na
                                   linha dos Voronoi treemaps (BALZER; DEUSSEN, 2005; NOCAJ; BRANDES, 2012).
   04 MANCHA QUE CRESCE (indic.) — agregação limitada por difusão, DLA (WITTEN; SANDER, 1981): caminhantes
                                   aleatórios grudam ao tocar o agregado de cada ano; a massa de cada
                                   mancha é o valor somado do ano, a cor é o mecanismo de cada fração.
   05 CORDAS (indic.)            — diagrama de cordas entre mecanismo e ano/escala/circuito, à maneira do
                                   Circos (KRZYWINSKI et al., 2009); fitas por curvas quadráticas pelo centro.
   06 RIO (indic.)               — streamgraph ano × mecanismo, com linha de base em silhueta
                                   (HAVRE et al., 2000; BYRON; WATTENBERG, 2008).

   Linguagem: papel #f7f6f1, tinta #161616, cor por mecanismo (rosa/azul/verde), cores de linha de
   Rizoma.LINES, títulos condensados, poucos elementos. Rompe com ela em dois pontos, ditos no próprio
   painel: o modo "asfalto" (fundo escuro, como Information is Beautiful e Negro Muro) e as células cheias
   do Voronoi (área pintada em vez de linha). Mobile-first: handlers de toque do p5 só devolvem false
   quando o evento nasce no canvas.
*/
(() => {
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const PROJECTS = (window.CARTOGRAFIA_DATA || []).slice();
const R = window.Rizoma || null;
const MECH = { "Incentivo Fiscal": [255, 79, 154], "Fundo Municipal": [49, 168, 255], "Descentra": [101, 231, 125] };
const MECHS = Object.keys(MECH);
const LINES = R && R.LINES ? R.LINES : { ano: { color: [255, 210, 63] }, mecanismo: { color: [64, 196, 255] }, edital: { color: [255, 92, 168] }, escala: { color: [120, 255, 150] }, territorio: { color: [200, 170, 255] }, curadoria: { color: [255, 150, 80] } };
const YEARS = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
const PAPER = [247, 246, 241], INK = [22, 22, 22];
const TOTAL = PROJECTS.reduce((s, d) => s + (Number(d.value) || 0), 0) || 1;
const MAX = Math.max(1, ...PROJECTS.map(d => Number(d.value) || 0));
const money = R && R.money ? R.money : v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const shortTitle = R && R.shortTitle ? R.shortTitle : t => String(t || "").split(" – ")[0].split(":")[0];
const scaleOf = v => v <= 30000 ? "Micro" : v <= 100000 ? "Médio" : "Macro";
const shortMoney = v => v >= 1e6 ? "R$ " + (v / 1e6).toFixed(2).replace(".", ",") + " mi" : "R$ " + Math.round(v / 1000) + " mil";
const SCALES = ["Micro", "Médio", "Macro"], CIRCUITS = ["Monumental", "Capilar"];
const mechColor = d => MECH[d.mechanism] || [120, 120, 120];
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mobile = () => innerWidth <= 780;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FONT = "Arial Narrow"; // p5 1.11 envolve o nome em aspas: uma família só (no Android cai na sans padrão)

const state = { exp: "fluxo", dark: false, params: {}, pointer: { x: -1, y: -1, down: false, at: 0 } };
const ctx = {
  params: state.params, pointer: state.pointer, font: FONT,
  get mobile() { return mobile(); }, get reduced() { return reduced; },
  bg: () => state.dark ? INK : PAPER, ink: () => state.dark ? PAPER : INK, dark: () => state.dark,
  readout: html => { $("#readout").innerHTML = html || ""; },
  /* região útil para os gráficos: fora do painel de texto (esquerda/topo), da legenda e dos controles (embaixo) */
  region: () => {
    const cp = $(".copy"), ct = $("#controls"), lg = $("#legend"), st = $("#stage"), m = mobile();
    const w = st.clientWidth, h = st.clientHeight;
    if (m) return { x0: 10, y0: cp.offsetHeight + 10, x1: w - 10, y1: h - ct.offsetHeight - 20 - lg.offsetHeight - 72 };
    return { x0: cp.offsetLeft + cp.offsetWidth + 24, y0: lg.offsetTop + lg.offsetHeight + 12, x1: w - 20, y1: h - ct.offsetHeight - 28 };
  },
  hint: txt => { const h = $("#hint"); h.textContent = txt; h.classList.add("show"); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove("show"), 2600); }
};

    question: "O TÍTULO DA CAPA PODE SER, ELE MESMO, O PRIMEIRO GRÁFICO DO TCC?",
    credit: "<b>Algoritmo:</b> amostragem de texto em pixels (p5.Graphics + loadPixels) e comportamento de direção \"arrive\" (REYNOLDS, 1999; SHIFFMAN, 2012). Implementação própria.",
    legend: "mech",
    controls: [
      { id: "disp", label: "DISPERSÃO", type: "range", min: 30, max: 220, value: 110 },
      { id: "ordem", label: "FATIAS POR", type: "seg", options: [["ano", "ANO"], ["mecanismo", "MECANISMO"], ["valor", "VALOR"]], value: "ano" },
      { type: "actions", items: [{ id: "reset", label: "RECOMEÇAR" }, { id: "theme", label: "PAPEL / ASFALTO" }] }

/* ---------- interface ---------- */
let current = null, p5inst = null, stageEl = $("#stage");
function buildTabs() {
  $("#tabs").innerHTML = Object.keys(EXPS).map(k => `<button type="button" data-exp="${k}" class="${k === state.exp ? "active" : ""}"><small>${EXPS[k].n}</small>${EXPS[k].tab}</button>`).join("");
  $$("[data-exp]").forEach(b => b.addEventListener("click", () => select(b.dataset.exp)));
}
function buildControls(def) {

/* ========== 03 CÉLULAS DE VALOR (Voronoi / potência / área = valor) ========== */
function expVoronoi(p, c) {

  const P = c.params; let Rg = { x0: 0, y0: 0, x1: 1, y1: 1 };

    seeds = PROJECTS.map((d, i) => { const row = MECHS.indexOf(d.mechanism); return { x: xYear(d.year) + (hash(i * 5 + 1) - 0.5) * 36, y: yRow(row + 0.5 + (hash(i * 7 + 3) - 0.5) * 0.75), d, w: 0 }; });

  function compute() {
    const n = seeds.length; areas.fill(0);
    for (let gy = 0; gy < gh; gy++) { const y = (gy + 0.5) * cs; for (let gx = 0; gx < gw; gx++) { const x = (gx + 0.5) * cs; let best = 0, bd = Infinity; for (let i = 0; i < n; i++) { const s = seeds[i]; const dx = x - s.x, dy = y - s.y; const dd = dx * dx + dy * dy - s.w; if (dd < bd) { bd = dd; best = i; } } owner[gy * gw + gx] = best; areas[best]++; } }

  }

    const K = (vertical ? 0.06 : 0.085) * (Rg.x1 - Rg.x0) * (Rg.y1 - Rg.y0) / (cs * cs), midY = (Rg.y0 + Rg.y1) / 2, midX = (Rg.x0 + Rg.x1) / 2;
    years = YEARS.map((y, k) => {
      const ps = PROJECTS.filter(d => d.year === y), v = ps.reduce((s, d) => s + (Number(d.value) || 0), 0);
      const cx = vertical ? Math.round((midX + (k % 2 ? 1 : -1) * (Rg.x1 - Rg.x0) * 0.16) / cs) : Math.round(p.map(y, 2017, 2024, Rg.x0 + 40, Rg.x1 - 40) / cs);
      const cy = vertical ? Math.round(p.map(k, 0, 7, Rg.y0 + 56, Rg.y1 - 40) / cs) : Math.round((midY + (k % 2 ? 1 : -1) * (Rg.y1 - Rg.y0) * 0.07) / cs);
      return { y, ps, v, cx, cy, budget: Math.round(K * v / TOTAL), placed: 0, r: 2, walkers: [], active: false, weights: ps.map(d => Number(d.value) || 0) };
    });
    for (const Y of years) if (Y.budget > 0) { grid[Y.cy * gw + Y.cx] = 1 + MECHS.indexOf(Y.ps[0].mechanism); Y.placed = 1; }
    img.loadPixels(); for (let k = 0; k < gw * gh * 4; k++) img.pixels[k] = 0; img.updatePixels(); done = false; hot = -1;
    caption = `<b>Cada célula ≈ ${money(TOTAL / Math.max(1, years.reduce((s, Y) => s + Y.budget, 0)))}</b>Caminhantes aleatórios grudam ao tocar a mancha do seu ano. ${c.mobile ? "Toque" : "Passe"} num ano para ver quem o compõe.`; c.readout(caption);
  }
  function pickMech(Y) { let r = Math.random() * Y.v; for (let i = 0; i < Y.ps.length; i++) { r -= Y.weights[i]; if (r <= 0) return 1 + MECHS.indexOf(Y.ps[i].mechanism); } return 1 + MECHS.indexOf(Y.ps[Y.ps.length - 1].mechanism); }
  function spawn(Y) { const a = Math.random() * Math.PI * 2, rr = Y.r + 4; return { x: Math.round(Y.cx + Math.cos(a) * rr), y: Math.round(Y.cy + Math.sin(a) * rr), m: pickMech(Y) }; }
  function step() {
    const speed = P.vel, perFrame = Math.round(p.map(speed, 1, 100, 6, 70)) * (c.mobile ? 0.6 : 1);
    let any = false;
    years.forEach((Y, k) => {
      if (Y.budget <= 0 || Y.y > P.ate) return;
      const prev = years.slice(0, k).filter(z => z.budget > 0 && z.y <= P.ate).pop();
      Y.active = !prev || prev.placed >= prev.budget * 0.55;
      if (!Y.active || Y.placed >= Y.budget) return;
      any = true;
      while (Y.walkers.length < 24) Y.walkers.push(spawn(Y));
      let stuck = 0;
      for (let round = 0; round < 8 && stuck < perFrame; round++) for (let w = 0; w < Y.walkers.length && stuck < perFrame; w++) {
        const wk = Y.walkers[w];
        for (let s = 0; s < 80; s++) {
          const dir = Math.random() * 4 | 0; wk.x += dir === 0 ? 1 : dir === 1 ? -1 : 0; wk.y += dir === 2 ? 1 : dir === 3 ? -1 : 0;
          const dx = wk.x - Y.cx, dy = wk.y - Y.cy;
          if (wk.x <= 0 || wk.y <= 0 || wk.x >= gw - 1 || wk.y >= gh - 1 || dx * dx + dy * dy > (Y.r + 14) ** 2) { Y.walkers[w] = spawn(Y); break; }
          const k0 = wk.y * gw + wk.x;
          if (grid[k0 - 1] || grid[k0 + 1] || grid[k0 - gw] || grid[k0 + gw]) {
            grid[k0] = wk.m; Y.placed++; stuck++; const d = Math.sqrt(dx * dx + dy * dy); if (d > Y.r) Y.r = d;
            const o = k0 * 4, col = MECH[MECHS[wk.m - 1]]; img.pixels[o] = col[0]; img.pixels[o + 1] = col[1]; img.pixels[o + 2] = col[2]; img.pixels[o + 3] = 255;
            Y.walkers[w] = spawn(Y); break;
          }
        }
      }
    });
    if (any) { img.updatePixels(); }
    done = !any;
  }
  function pickYear(x, y) { if (!Rg || x < Rg.x0 || x > Rg.x1 || y < Rg.y0 || y > Rg.y1) return -1; let best = -1, bd = 1e9; years.forEach((Y, k) => { const dx = Y.cx * cs - x, dy = Y.cy * cs - y, d2 = vertical ? dy * dy : dx * dx; if (d2 < bd) { bd = d2; best = k; } }); return best; }
  function show(k) { hot = k; const Y = years[k]; if (!Y) { c.readout(caption); return; } c.readout(Y.ps.length ? `<b>${Y.y} · ${Y.ps.length} projeto(s) · ${money(Y.v)}</b>${Y.ps.map(d => shortTitle(d.title)).join(" · ")}` : `<b>${Y.y}</b>Nenhum projeto de grafite ou muralismo do corpus neste ano.`); }
  return {
    setup() { layout(); }, resize() { layout(); }, reset() { layout(); }, dispose() { },
    change(id) { if (id === "ate") { if (years.some(Y => Y.placed > 1 && Y.y > P.ate)) layout(); done = false; } },
    press(x, y) { show(pickYear(x, y)); }, move(x, y) { if (!c.mobile) show(pickYear(x, y)); },
    draw() {
      if (!done) step();
      const bg = c.bg(), ink = c.ink();
      p.background(bg[0], bg[1], bg[2]);
      // linha do tempo
      p.stroke(ink[0], ink[1], ink[2], 70); p.strokeWeight(1);
      const midY = (Rg.y0 + Rg.y1) / 2, midX = (Rg.x0 + Rg.x1) / 2;
      if (vertical) p.line(midX, Rg.y0 + 40, midX, Rg.y1 - 24); else p.line(Rg.x0 + 16, midY, Rg.x1 - 16, midY);
      p.push(); p.noSmooth(); p.image(img, 0, 0, gw * cs, gh * cs); p.pop(); p.smooth();
      years.forEach((Y, k) => {
        const x = Y.cx * cs, y = Y.cy * cs, on = Y.y <= P.ate;
        p.stroke(ink[0], ink[1], ink[2], on ? 200 : 70); p.strokeWeight(k === hot ? 2 : 1);
        if (vertical) { p.line(midX - 6, y, midX + 6, y); small(p, String(Y.y), midX + (k % 2 ? -14 : 14), y, k % 2 ? p.RIGHT : p.LEFT, on ? 200 : 90, 8); }
        else { p.line(x, midY - 6, x, midY + 6); small(p, String(Y.y), x, Rg.y1 - 20, p.CENTER, on ? 200 : 90, k === hot ? 9 : 8); if (Y.budget > 0 && on) small(p, shortMoney(Y.v), x, Rg.y1 - 8, p.CENTER, 110, 7); }
      });
    }
  };
}

/* ========== 05 CORDAS ========== */
function expCordas(p, c) {
  const P = c.params; let groups = [], ribbons = [], hot = -1;
  function rightGroups() { return P.lado === "ano" ? YEARS.map(String) : P.lado === "escala" ? SCALES : CIRCUITS; }
  function keyOf(d) { return P.lado === "ano" ? String(d.year) : P.lado === "escala" ? scaleOf(Number(d.value) || 0) : (d.circuit || "?"); }
  function measure(d) { return P.medida === "valor" ? (Number(d.value) || 0) : 1; }
  function build() {
    const right = rightGroups(); const F = MECHS.map(() => right.map(() => 0));
    for (const d of PROJECTS) { const i = MECHS.indexOf(d.mechanism), j = right.indexOf(keyOf(d)); if (i >= 0 && j >= 0) F[i][j] += measure(d); }
    const L = MECHS.map((m, i) => ({ name: m, tot: F[i].reduce((a, b) => a + b, 0), col: MECH[m], side: "L", i }));
    const Rg = right.map((k, j) => ({ name: k, tot: F.reduce((a, row) => a + row[j], 0), col: null, side: "R", j }));
    const all = L.concat(Rg.slice().reverse()).filter(g => g.tot > 0); const sum = all.reduce((a, g) => a + g.tot, 0) || 1;
    const gap = 0.035, span = Math.PI * 2 - gap * all.length; let a = -Math.PI / 2 + 0.25;
    for (const g of all) { g.a0 = a; g.a1 = a + span * g.tot / sum; g.cursor = g.a0; a = g.a1 + gap; }
    groups = all; ribbons = [];
    for (const g of L) for (let j = 0; j < right.length; j++) { const v = F[g.i][j]; if (!v) continue; const h = all.find(x => x.side === "R" && x.j === j); if (!h) continue;
      const ga = g.cursor, gb = g.cursor + (g.a1 - g.a0) * v / g.tot; g.cursor = gb; const ha = h.cursor, hb = h.cursor + (h.a1 - h.a0) * v / h.tot; h.cursor = hb;
      ribbons.push({ g, h, ga, gb, ha, hb, v, col: g.col }); }
    hot = -1; c.readout(caption());
  }
  function caption() { return `<b>${P.medida === "valor" ? "Arcos = valor somado" : "Arcos = número de projetos"}</b>Fitas ligam cada mecanismo a ${P.lado === "ano" ? "cada ano" : P.lado === "escala" ? "cada escala de valor (micro até R$ 30 mil, médio até R$ 100 mil, macro acima)" : "cada circuito (monumental ou capilar)"}. ${c.mobile ? "Toque" : "Passe"} num arco para seguir só as fitas dele.`; }
  function geo() { const g = c.region(); const cx = (g.x0 + g.x1) / 2, cy = (g.y0 + g.y1) / 2, r = Math.max(60, Math.min(g.x1 - g.x0, g.y1 - g.y0) / 2 - (c.mobile ? 34 : 44)); return { cx, cy, r }; }
  function arcPts(cx, cy, r, a0, a1) { const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 0.08)); const out = []; for (let i = 0; i <= n; i++) { const a = p.lerp(a0, a1, i / n); out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return out; }
  function pickGroup(x, y) { const { cx, cy, r } = geo(); const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy); if (d < r * 0.55 || d > r + 40) return -1; let a = Math.atan2(dy, dx); for (let i = 0; i < groups.length; i++) { const g = groups[i]; let aa = a; while (aa < g.a0 - 0.01) aa += Math.PI * 2; while (aa > g.a0 + Math.PI * 2) aa -= Math.PI * 2; if (aa >= g.a0 - 0.01 && aa <= g.a1 + 0.01) return i; } return -1; }
  function show(i) { hot = i; const g = groups[i]; if (!g) { c.readout(caption()); return; } const fmt = v => P.medida === "valor" ? money(v) : v + " projeto(s)"; const parts = ribbons.filter(rb => rb.g === g || rb.h === g).map(rb => (rb.g === g ? rb.h.name : rb.g.name) + " " + fmt(rb.v)); c.readout(`<b>${g.name} · ${fmt(g.tot)}</b>${parts.join(" · ")}`); }
  return {
    setup: build, resize() { }, reset: build, dispose() { },
    change(id) { if (id !== "theme") build(); },
    press(x, y) { show(pickGroup(x, y)); }, move(x, y) { if (!c.mobile) { const i = pickGroup(x, y); if (i !== hot) show(i); } },
    draw() {
      const bg = c.bg(), ink = c.ink(), { cx, cy, r } = geo();
      p.background(bg[0], bg[1], bg[2]);
      const hg = hot >= 0 ? groups[hot] : null;
      for (const rb of ribbons) {
        const on = !hg || rb.g === hg || rb.h === hg; const ri = r - 6;
        p.noStroke(); p.fill(rb.col[0], rb.col[1], rb.col[2], on ? (hg ? 200 : 120) : 22);
        p.beginShape(); const A = arcPts(cx, cy, ri, rb.ga, rb.gb), B = arcPts(cx, cy, ri, rb.ha, rb.hb);
        A.forEach((q, i) => i ? p.vertex(q[0], q[1]) : p.vertex(q[0], q[1])); p.quadraticVertex(cx, cy, B[0][0], B[0][1]); B.slice(1).forEach(q => p.vertex(q[0], q[1])); p.quadraticVertex(cx, cy, A[0][0], A[0][1]); p.endShape(p.CLOSE);
      }
      groups.forEach((g, i) => {
        const col = g.col || ink; p.push(); p.noFill(); p.stroke(col[0], col[1], col[2], hg && g !== hg ? 70 : 255); p.strokeWeight(i === hot ? 10 : 7); p.strokeCap(p.SQUARE);
        p.arc(cx, cy, r * 2, r * 2, g.a0, g.a1); p.pop();
        const am = (g.a0 + g.a1) / 2, lx = cx + Math.cos(am) * (r + 16), ly = cy + Math.sin(am) * (r + 16);
        const label = g.side === "L" ? g.name.toUpperCase() : (P.lado === "escala" ? g.name.toUpperCase() : g.name);
        small(p, label, lx, ly, Math.cos(am) < -0.2 ? p.RIGHT : Math.cos(am) > 0.2 ? p.LEFT : p.CENTER, hg && g !== hg ? 90 : 220, c.mobile ? 7.5 : 9);
      });
    }
  };
}

/* ========== 06 RIO (streamgraph) ========== */
function expRio(p, c) {
  const P = c.params; let series = [], tot = [], hot = -1;
  let Rg = { x0: 0, y0: 0, x1: 1, y1: 1 };
  const ML = () => Rg.x0 + 26, MR = () => p.width - Rg.x1 + 26, top = () => Rg.y0 + 30, bottom = () => p.height - Rg.y1 + 34;
  function caption() { return `<b>Largura do rio = ${P.medida === "valor" ? "valor somado do ano" : "número de projetos do ano"}</b>${c.mobile ? "Toque" : "Passe"} num ano para ver quem o compõe.`; }
  function build() {
    series = MECHS.map(m => YEARS.map(y => PROJECTS.filter(d => d.year === y && d.mechanism === m).reduce((s, d) => s + (P.medida === "valor" ? (Number(d.value) || 0) : 1), 0)));
    tot = YEARS.map((_, k) => series.reduce((s, row) => s + row[k], 0)); hot = -1; c.readout(caption());
  }
  function yScale() { const H = p.height - top() - bottom(); return H / Math.max(1, ...tot); }
  function show(k) { hot = k; const y = YEARS[k]; if (y == null) { c.readout(caption()); return; } const ps = PROJECTS.filter(d => d.year === y); c.readout(ps.length ? `<b>${y} · ${ps.length} projeto(s) · ${money(ps.reduce((s, d) => s + (Number(d.value) || 0), 0))}</b>${ps.map(d => shortTitle(d.title) + " (" + d.mechanism.split(" ")[0] + ")").join(" · ")}` : `<b>${y}</b>O rio seca: nenhum projeto do corpus neste ano.`); }
  function pickYear(x, y) { if (y != null && (y < Rg.y0 - 20 || y > Rg.y1 + 20)) return -1; let best = -1, bd = 1e9; YEARS.forEach((y, k) => { const d = Math.abs(xOfYear(p, y, ML(), MR()) - x); if (d < bd) { bd = d; best = k; } }); return best; }
  return {
    setup: build, resize() { }, reset: build, dispose() { },
    change(id) { if (id === "medida") build(); },
    press(x, y) { show(pickYear(x, y)); }, move(x, y) { if (!c.mobile) { const k = pickYear(x, y); if (k !== hot) show(k); } },
    draw() {
      Rg = c.region();
      const bg = c.bg(), ink = c.ink(), s = yScale(), mid = top() + (p.height - top() - bottom()) / 2, smooth = P.forma === "suave";
      p.background(bg[0], bg[1], bg[2]);
      const base = YEARS.map((_, k) => mid + tot[k] * s / 2); // silhueta: base centrada
      const tops = []; let prev = base.slice();
      series.forEach((row, i) => { const cur = row.map((v, k) => prev[k] - v * s); tops.push({ lo: prev, hi: cur, col: MECH[MECHS[i]], m: MECHS[i] }); prev = cur; });
      for (const layer of tops) {
        p.noStroke(); p.fill(layer.col[0], layer.col[1], layer.col[2], c.dark() ? 200 : 170);
        p.beginShape();
        const V = (x, y) => smooth ? p.curveVertex(x, y) : p.vertex(x, y);
        const xs = YEARS.map(y => xOfYear(p, y, ML(), MR()));
        if (smooth) V(xs[0], layer.hi[0]); xs.forEach((x, k) => V(x, layer.hi[k])); if (smooth) V(xs[7], layer.hi[7]);
        if (smooth) V(xs[7], layer.lo[7]); for (let k = 7; k >= 0; k--) V(xs[k], layer.lo[k]); if (smooth) V(xs[0], layer.lo[0]);
        p.endShape(p.CLOSE);
      }
      YEARS.forEach((y, k) => {
        const x = xOfYear(p, y, ML(), MR()); p.stroke(ink[0], ink[1], ink[2], k === hot ? 200 : 50); p.strokeWeight(k === hot ? 1.5 : 1); p.line(x, top() - 10, x, p.height - bottom() + 10);
        small(p, String(y), x, p.height - bottom() + 24, p.CENTER, k === hot ? 230 : 140, k === hot ? 9.5 : 8);
        if (tot[k]) small(p, P.medida === "valor" ? shortMoney(tot[k]) : tot[k] + " PROJ.", x, top() - 20, p.CENTER, 110, c.mobile ? 6.5 : 7.5); else small(p, "SECA", x, mid, p.CENTER, 90, 7);
      });
    }
  };
}

/* ---------- arranque ---------- */
const fromHash = location.hash.replace("#", ""); if (EXPS[fromHash]) state.exp = fromHash;
buildTabs();
if (typeof window.p5 === "function") new p5(host);
else { select(state.exp); $("#hint").textContent = "MOTOR VISUAL NÃO CARREGOU · OS TEXTOS E CONTROLES CONTINUAM"; $("#hint").classList.add("show"); }
window.Lab6 = { state, EXPS, select, get current() { return current; }, get p() { return p5inst; } };
})();
